<ng-box class="pokemon-card" orientation="vertical" spacing="8px">
  <ng-image id="poke_sprite" src="{{ sprite() }}" width="180" height="180" />
  <ng-label id="poke_num" class="poke-num">{{ number() }}</ng-label>
  <ng-label id="hello" class="hero-title">{{ name() }}</ng-label>
  <ng-content />
</ng-box>
