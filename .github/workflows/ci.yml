name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Angular & Tooling dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting (Oxfmt)
        run: pnpm run format:check

      - name: Lint Angular & TypeScript (Oxlint + Angular ESLint)
        run: pnpm run lint

      - name: Build Angular & Native Bundle (.ngb)
        run: pnpm run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit and integration tests (Headless Backend)
        run: cargo test --verbose
